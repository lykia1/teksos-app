name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Imza sifresi kontrolu
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "KS_PASS gizli ayari eksik: Settings > Secrets and variables > Actions > New repository secret" | tee -a derleme.log
            exit 1
          fi

      - name: Paketler
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a derleme.log

      - name: Android projesi
        run: |
          set -o pipefail
          SURUM=$(node -p "require('./package.json').version")
          echo "SURUM=$SURUM" >> $GITHUB_ENV
          npx cap add android 2>&1 | tee -a derleme.log
          node scripts/hazirla.js ${{ github.run_number }} "$SURUM" 2>&1 | tee -a derleme.log
          npx cap sync android 2>&1 | tee -a derleme.log
          base64 -d imza/teksos.jks.b64 > android/app/teksos.jks

      - name: APK derle
        working-directory: android
        env:
          KS_FILE: teksos.jks
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee -a ../derleme.log
          cp app/build/outputs/apk/release/app-release.apk ../Teksos-${SURUM}.apk

      - name: Surum yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SURUM }}-${{ github.run_number }}
          name: Teksos ${{ env.SURUM }} (derleme ${{ github.run_number }})
          files: Teksos-${{ env.SURUM }}.apk
          body: Telefona kurulacak dosya asagida (Teksos-${{ env.SURUM }}.apk).

      - name: Hata kaydi
        if: failure()
        run: |
          git config user.name "derleme"
          git config user.email "derleme@users.noreply.github.com"
          tail -c 60000 derleme.log > /tmp/son-hata.log 2>/dev/null || echo "kayit yok" > /tmp/son-hata.log
          git checkout --orphan derleme-log
          git rm -rf --cached . >/dev/null
          cp /tmp/son-hata.log son-hata.log
          git add -f son-hata.log
          git commit -m "Derleme hatasi #${{ github.run_number }}"
          git push -f origin derleme-log
