name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Imza sifresi kontrolu
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "KS_PASS gizli ayari eksik: Settings > Secrets and variables > Actions > New repository secret" | tee -a derleme.log
            exit 1
          fi

      - name: APK derle
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          set -o pipefail
          SURUM=$(cat surum.txt | tr -d '[:space:]')
          echo "SURUM=$SURUM" >> $GITHUB_ENV
          base64 -d imza/teksos.jks.b64 > app/teksos.jks
          export KS_FILE=teksos.jks
          export VCODE=$((100 + ${{ github.run_number }}))
          export VNAME="$SURUM"
          gradle :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee -a derleme.log
          cp app/build/outputs/apk/release/app-release.apk Teksos-${SURUM}.apk

      - name: Surum yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SURUM }}-${{ github.run_number }}
          name: Teksos ${{ env.SURUM }} (derleme ${{ github.run_number }})
          files: Teksos-${{ env.SURUM }}.apk
          body: Telefona kurulacak dosya asagida (Teksos-${{ env.SURUM }}.apk).

      - name: APK dalina yaz
        run: |
          git config user.name "derleme"
          git config user.email "derleme@users.noreply.github.com"
          cp Teksos-${SURUM}.apk /tmp/Teksos.apk
          git checkout --orphan apk-son
          git rm -rf --cached . >/dev/null
          cp /tmp/Teksos.apk Teksos.apk
          echo "${SURUM} (derleme ${{ github.run_number }})" > surum.txt
          git add -f Teksos.apk surum.txt
          git commit -m "APK ${SURUM} #${{ github.run_number }}"
          git push -f origin apk-son

      - name: Hata kaydi
        if: failure()
        run: |
          git config user.name "derleme"
          git config user.email "derleme@users.noreply.github.com"
          grep -E "^e: |error:|What went wrong|FAILURE|Could not|Unresolved|> " derleme.log | head -150 > /tmp/ozet.log || true
          { echo "=== OZET ==="; cat /tmp/ozet.log; echo; echo "=== SON ==="; tail -c 40000 derleme.log; } > /tmp/son-hata.log 2>/dev/null || echo "kayit yok" > /tmp/son-hata.log
          git checkout --orphan derleme-log
          git rm -rf --cached . >/dev/null
          cp /tmp/son-hata.log son-hata.log
          git add -f son-hata.log
          git commit -m "Derleme hatasi #${{ github.run_number }}"
          git push -f origin derleme-log
