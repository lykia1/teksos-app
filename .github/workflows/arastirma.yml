name: Arastirma
on:
  push:
    branches: [arastirma]
jobs:
  surumler:
    runs-on: ubuntu-latest
    steps:
      - run: |
          m() { echo "== $1"; curl -s "https://repo1.maven.org/maven2/$1/maven-metadata.xml" | grep -oE "<version>[^<]+</version>" | sed 's/<[^>]*>//g' | grep -viE "alpha|beta|rc|dev|eap|-M" | tail -${2:-8} | tr '\n' ' '; echo; }
          g() { echo "== $1"; curl -s "https://dl.google.com/dl/android/maven2/$1/maven-metadata.xml" | grep -oE "<version>[^<]+</version>" | sed 's/<[^>]*>//g' | grep -viE "alpha|beta|rc|dev" | tail -${2:-10} | tr '\n' ' '; echo; }
          m org/jetbrains/compose/material3/material3
          m org/jetbrains/compose/ui/ui
          m org/jetbrains/compose/foundation/foundation
          m org/jetbrains/compose/runtime/runtime
          m org/jetbrains/compose/components/components-resources
          m org/jetbrains/compose/ui/ui-backhandler
          g com/android/tools/build/gradle 30
          g androidx/activity/activity-compose
          g com/google/android/gms/play-services-location 4
          m com/onesignal/OneSignal 4
          curl -s https://raw.githubusercontent.com/JetBrains/compose-multiplatform/master/CHANGELOG.md | head -120
          echo "== kotlin compat"; curl -s https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html | grep -oE "Xcode [0-9.]+" | sort -u | tail -5
          curl -s https://api.github.com/repos/OneSignal/OneSignal-XCFramework/releases/latest | grep tag_name
          curl -s https://api.github.com/repos/yonaskolb/XcodeGen/releases/latest | grep tag_name
